name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['28.2', '29.4', '30.1']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install org-lark and shell-maker from MELPA
        run: |
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\"))" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'org-lark)" \
            --eval "(package-install 'shell-maker)"

      - name: Byte-compile
        run: |
          emacs --batch -L . -L core -L ui -L domain -L ai \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            --eval "(setq byte-compile-error-on-warn t)" \
            -f batch-byte-compile \
            core/elark-core.el \
            core/elark-auth.el \
            core/elark-transient.el \
            ui/elark-ui.el \
            domain/elark-calendar.el \
            domain/elark-tasks.el \
            domain/elark-im.el \
            domain/elark-mail.el \
            domain/elark-docs.el \
            domain/elark-drive.el \
            domain/elark-sheets.el \
            domain/elark-contact.el \
            domain/elark-meetings.el \
            domain/elark-whiteboard.el \
            ai/elark-ai-skills.el \
            ai/elark-ai-context.el \
            ai/elark-ai-context-graph.el \
            ai/elark-ai-agent.el \
            ai/elark-ai.el \
            elark.el

      - name: Run tests
        run: |
          emacs --batch -L . -L core -L ui -L domain -L ai -L test \
            --eval "(require 'package)" \
            --eval "(package-initialize)" \
            -l elark-core-test \
            -l elark-auth-test \
            -l elark-ui-test \
            -l elark-calendar-test \
            -l elark-tasks-test \
            -l elark-im-test \
            -l elark-mail-test \
            -l elark-docs-test \
            -l elark-drive-test \
            -l elark-sheets-test \
            -l elark-contact-test \
            -l elark-meetings-test \
            -l elark-whiteboard-test \
            -l elark-ai-test \
            -l elark-ai-context-graph-test \
            -f ert-run-tests-batch-and-exit
